[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lazy-trip"
version = "0.1.0"
description = "A local day-trip research and planning toolkit, with official Amap MCP handoff."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "NadouKing" }]
dependencies = [
  "xiaohongshu-tools>=0.1.0,<0.2",
  "dazhongdianping-tools>=0.1.0,<0.2",
]

[project.scripts]
lazy-trip = "lazy_trip.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.13,<1"]

[tool.uv.sources]
xiaohongshu-tools = { git = "https://github.com/NadouKing/xiaohongshu-tools", rev = "33918baf68ce084080fda9465166c9ec14057f33" }
dazhongdianping-tools = { git = "https://github.com/NadouKing/dazhongdianping-tools", rev = "2938e43c76cd79f309a071abe9e0e15001c05739" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/lazy_trip"]
